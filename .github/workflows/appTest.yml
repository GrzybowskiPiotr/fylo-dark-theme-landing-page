name: AppTest
run-name: App_Test
on: [push]
jobs:
  App_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - run: npm ci
      - run: build --if-present
